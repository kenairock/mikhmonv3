version: "3"
services:
  php:
    image: php:8.5-fpm
    container_name: mikhmon_php
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www/
      - ./deploy/docker/mikhmon-php.ini:/usr/local/etc/php/conf.d/zz-mikhmon.ini:ro
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.5
  nginx:
    image: nginx:alpine
    container_name: nginx
    tty: true
    volumes:
      - .:/var/www/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      # bind to localhost only; change to "8080:80" to expose on the network
      - "127.0.0.1:8080:80"
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.6
  # RouterOS test instance for development only
  routeros:
    image: evilfreelancer/docker-routeros
    container_name: mikrotik_test
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "127.0.0.1:8728:8728"
      - "127.0.0.1:8729:8729"
      - "127.0.0.1:8081:80"
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.7
networks:
  mikhmon_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.27.0.0/24
