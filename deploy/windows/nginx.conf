#  nginx config for Mikhmon on Windows
#  nginx : E:\Applications\nginx-1.30.6   (app in .\html)
#  PHP   : php-cgi.exe 8.5 listening on 127.0.0.1:9000 (see start-php-cgi.cmd)

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip        on;
    gzip_types  text/css application/javascript application/json image/svg+xml;

    upstream php_backend {
        server 127.0.0.1:9000;
    }

    server {
        listen       80;
        server_name  localhost;

        root   E:/Applications/nginx-1.30.6/html;
        index  index.php;
        charset utf-8;

        # Logo upload limit in the app is 2 MB
        client_max_body_size 3m;

        add_header X-Frame-Options         "SAMEORIGIN"  always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Referrer-Policy         "same-origin" always;

        # ---- Block things that must never be served ------------------------
        # (regex locations are checked in order, so these come before \.php$)

        # dotfiles / VCS (.git, .profile, .htaccess ...)
        location ~ /\. {
            deny all;
        }

        # server-side only code and data
        location ~* ^/(include|lib|lang|deploy)(/|$) {
            deny all;
        }

        # process/* are only included by index.php (getvalidprice.php is called by the browser)
        location ~* ^/process/(?!getvalidprice\.php$) {
            deny all;
        }

        # voucher templates are only included by voucher/print.php & vpreview.php
        location ~* ^/voucher/(temp|variable|printbt|template|template-small|template-thermal|default|default-small|default-thermal)\.php$ {
            deny all;
        }

        # never execute anything from the upload folder
        location ~* ^/img/.*\.(php|phtml|phar)$ {
            deny all;
        }

        # repository / deployment files
        location ~* \.(md|yml|yaml|conf|ini|log|bak|sh|lock|dist|sqlite|sqlite-wal|sqlite-shm|db)$ {
            deny all;
        }
        location ~* ^/(LICENSE|verson\.txt)$ {
            deny all;
        }

        # ---- PHP -----------------------------------------------------------
        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass   php_backend;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_param  HTTP_PROXY       "";
            # account / audit database (outside the web root)
            fastcgi_param  MIKHMON_DB       "E:/Applications/nginx-1.30.6/php-data/mikhmon.sqlite";

            # router API calls can be slow; keep below PHP's max_execution_time margin
            fastcgi_read_timeout  60s;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
        }
    }
}
